name: CI

on:
  push:
    branches: [main, feature/manzur-white-label-multitenant]
  pull_request:
    branches: [main, feature/manzur-white-label-multitenant]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, tests, both web brands
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:run

      - name: Build-safety tests
        run: pnpm test:web:build

      - name: Verify isolated Hamarr web build
        run: pnpm build:web:hamarr

      - name: Verify isolated Manzur web build
        run: pnpm build:web:manzur
